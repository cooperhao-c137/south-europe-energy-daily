<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cooper · 欧洲能源日报</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#1e293b;font:15px/1.8 system-ui,-apple-system,"Microsoft YaHei",sans-serif}header{background:#102a43;color:white;padding:32px max(6vw,20px)}header small{color:#82dacb;letter-spacing:3px}h1{font-size:30px;margin:8px 0}header p{color:#b8cbdc;margin:0}main{max-width:1100px;margin:auto;padding:28px 20px}select,input,button{font:inherit;padding:9px 13px;border:1px solid #dce3ea;border-radius:7px;background:white;color:#263d50}input{flex:1;min-width:170px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.brief{padding:24px;border-left:4px solid #159b88;background:#eaf5f2;border-radius:8px}.brief h2{margin:0 0 8px}h2{font-size:22px}article{background:white;border:1px solid #e1e7ec;border-radius:10px;padding:24px;margin:16px 0}h3{font-size:21px;margin:10px 0}.meta{color:#718096;font-size:13px}.tag{display:inline-block;background:#eef3f8;padding:2px 9px;margin:0 6px 3px 0;border-radius:4px;font-size:12px}.insight{background:#f6f8fa;padding:14px 18px;border-radius:6px}.insight b{color:#168574}a{color:#0b8278;text-decoration:none}.link{display:inline-block;margin-top:14px}details{background:#edf1f5;padding:16px;border-radius:8px;margin:25px 0}footer{color:#718096;border-top:1px solid #dae2eb;padding:20px 0;font-size:12px}.empty{padding:40px;text-align:center}#summary{white-space:pre-wrap}@media(max-width:600px){h1{font-size:25px}article{padding:18px}header{padding:25px 20px}}
</style><header><small>COOPER ENERGY INTELLIGENCE</small><h1>欧洲能源行业日报</h1><p>南欧 · 英国 · 巴尔干｜光储与电动出行</p></header><main><div class="toolbar"><select id="date" aria-label="日报日期"></select><button id="refresh">刷新日报</button></div><section class="brief"><h2>今日重点</h2><p id="summary">正在读取日报…</p><ol id="highlights"></ol></section><h2>重点情报 <span id="count"></span></h2><div class="toolbar"><select id="country" aria-label="筛选市场"></select><select id="sector" aria-label="筛选赛道"><option value="">全部赛道</option><option>PV</option><option>ESS</option><option>电动二/三轮</option><option>充电</option><option>四轮车</option></select><input id="search" placeholder="搜索公司、事件或关键词" aria-label="搜索情报"><button id="clear">清除筛选</button></div><div id="articles"></div><details><summary>来源覆盖与核实说明</summary><p id="coverage"></p><p>商业判断为分析，不代表已确认采购需求或客户关系。</p><p id="updated"></p></details><footer>COOPER ENERGY INTELLIGENCE · 欧洲能源行业业务开发</footer></main><script>
const $=id=>document.getElementById(id);let reports=[],current;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){if(!current)return;let q=$('search').value.trim().toLowerCase();let items=current.articles.filter(a=>(!$('country').value||a.country===$('country').value)&&(!$('sector').value||a.sectors.includes($('sector').value))&&(!q||[a.title,a.fact,a.insight,a.source].join(' ').toLowerCase().includes(q)));$('count').textContent=items.length;$('articles').innerHTML=items.map(a=>{let url='';try{let u=new URL(a.url);if(u.protocol==='https:')url=u.href}catch{}return `<article><div>${[a.country,...a.sectors,a.priority,...(a.supplementary?['补充来源']:[])].map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><h3>${esc(a.title)}</h3><div class="meta">${esc(a.source)} · 发布于 ${esc(a.published)}</div><p>${esc(a.fact)}</p><div class="insight"><b>开发判断 · 待验证</b><div>${esc(a.insight)}</div></div>${url?`<a class="link" href="${esc(url)}" target="_blank" rel="noopener noreferrer">阅读原文 ↗</a>`:''}</article>`}).join('')||'<div class="empty">没有符合条件的情报</div>'}
function select(){current=reports.find(r=>r.date===$('date').value);if(!current)return;$('summary').textContent=current.summary;$('highlights').innerHTML=current.highlights.map(t=>`<li>${esc(t)}</li>`).join('');$('coverage').textContent=current.coverage;$('updated').textContent='本期更新时间：'+new Date(current.updatedAt).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'})+'（北京时间）';$('country').innerHTML='<option value="">全部市场</option>'+[...new Set(current.articles.map(a=>a.country))].map(c=>`<option>${esc(c)}</option>`).join('');$('sector').value='';$('search').value='';render()}
async function load(){try{let r=await fetch('./reports.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);reports=await r.json();reports.sort((a,b)=>b.date.localeCompare(a.date));let previous=$('date').value;$('date').innerHTML=reports.map(r=>`<option>${esc(r.date)}</option>`).join('');if(reports.some(r=>r.date===previous))$('date').value=previous;if(reports.length)select();else $('summary').textContent='暂无日报'}catch(e){$('summary').textContent='读取失败，请稍后刷新：'+e.message}}
$('date').onchange=select;['country','sector'].forEach(id=>$(id).onchange=render);$('search').oninput=render;$('clear').onclick=()=>{$('country').value='';$('sector').value='';$('search').value='';render()};$('refresh').onclick=load;load();
</script></html>
